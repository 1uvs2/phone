<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">

<!-- 아이폰 홈 화면 앱 설정 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="설정">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7">


<!-- 아이폰 홈 화면 아이콘 -->
<link rel="apple-touch-icon" sizes="180x180" href="./icon.png?v=4">
<link rel="icon" type="image/png" href="./icon.png?v=4">


<title>설정</title>

<style>
:root{
  --bg:#f2f2f7;
  --card:#ffffff;
  --text:#000000;
  --sub:#8e8e93;
  --line:#e5e5ea;
  --blue:#007aff;
  --green:#34c759;
  --red:#ff3b30;
  --font:-apple-system,BlinkMacSystemFont,
    "SF Pro Text","Apple SD Gothic Neo",
    "Noto Sans KR",sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  background:var(--bg);
  font-family:var(--font);
  color:var(--text);
  font-size:17px;
  -webkit-text-size-adjust:100%;
}

body{
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  position:relative;
  height:100%;
  max-width:440px;
  margin:auto;
  overflow:hidden;
  background:var(--bg);
}

.page{
  position:absolute;
  inset:0;
  overflow-y:auto;
  background:var(--bg);
  padding:0 16px 125px;
  -webkit-overflow-scrolling:touch;
}

.page.hidden{
  display:none;
}

.nav{
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:center;
  height:62px;
  margin:0 -16px;
  background:rgba(242,242,247,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.nav-title{
  font-size:17px;
  font-weight:600;
}

.back{
  position:absolute;
  left:16px;
  top:9px;
  width:44px;
  height:44px;
  border-radius:50%;
  border:1px solid rgba(0,0,0,.05);
  background:#fff;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  display:grid;
  place-items:center;
  font-size:27px;
  font-weight:300;
}

.large{
  font-size:34px;
  font-weight:700;
  margin:14px 2px 20px;
  letter-spacing:-.5px;
}

.group{
  background:var(--card);
  border-radius:24px;
  overflow:hidden;
  margin-bottom:34px;
}

.row{
  position:relative;
  min-height:51px;
  display:flex;
  align-items:center;
  padding:0 15px;
  cursor:pointer;
}

.row:active{
  background:#ededf1;
}

.row+.row::before{
  content:"";
  position:absolute;
  top:0;
  left:16px;
  right:16px;
  height:.5px;
  background:var(--line);
}

.row.icon-row+.row.icon-row::before{
  left:56px;
}

.row-icon{
  width:30px;
  height:30px;
  flex-shrink:0;
  margin-right:12px;
  margin-left:-3px;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:18px;
  font-weight:600;
  overflow:hidden;
}

.label{
  flex:1;
  min-width:0;
  padding:14px 0;
  line-height:1.2;
}

.value{
  color:var(--sub);
  font-size:16px;
  margin-left:8px;
  white-space:nowrap;
}

.chevron{
  color:#c7c7cc;
  font-size:27px;
  font-weight:300;
  margin-left:10px;
}

.badge{
  background:var(--red);
  color:#fff;
  border-radius:15px;
  padding:2px 7px;
  font-size:15px;
}

.profile{
  display:flex;
  align-items:center;
  gap:15px;
  min-height:96px;
  padding:15px;
  cursor:pointer;
}

.avatar{
  width:61px;
  height:61px;
  border-radius:50%;
  flex-shrink:0;
  background:linear-gradient(#b4bac4,#858b98);
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-size:35px;
  color:#fff;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-name{
  font-size:21px;
  font-weight:600;
}

.profile-sub{
  margin-top:4px;
  color:var(--sub);
  font-size:15px;
}

.switch{
  width:62px;
  height:29px;
  background:#e9e9ea;
  border-radius:16px;
  position:relative;
  flex-shrink:0;
  transition:.25s;
}

.switch::after{
  content:"";
  position:absolute;
  width:36px;
  height:25px;
  top:2px;
  left:2px;
  background:#fff;
  border-radius:13px;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
  transition:.25s;
}

.switch.on{
  background:var(--green);
}

.switch.on::after{
  transform:translateX(22px);
}

.dock{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  z-index:20;
  padding:22px 24px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(
    transparent,
    var(--bg) 35%
  );
}

.search-button{
  width:100%;
  height:49px;
  border:0;
  border-radius:25px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 18px;
  color:var(--sub);
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  text-align:left;
}

.search-page{
  position:absolute;
  inset:0;
  z-index:30;
  background:var(--bg);
  display:none;
  flex-direction:column;
}

.search-page.open{
  display:flex;
}

.search-results{
  flex:1;
  overflow-y:auto;
  padding:20px 16px;
}

.search-bottom{
  display:flex;
  gap:10px;
  padding:12px 16px calc(14px + env(safe-area-inset-bottom));
}

.search-input{
  flex:1;
  width:0;
  height:48px;
  background:#fff;
  border:0;
  border-radius:25px;
  outline:none;
  padding:0 18px;
}

.cancel{
  width:48px;
  height:48px;
  background:#fff;
  border:0;
  border-radius:50%;
}

.sheet-bg{
  position:absolute;
  inset:0;
  z-index:40;
  display:none;
  background:rgba(0,0,0,.25);
  align-items:flex-end;
}

.sheet-bg.open{
  display:flex;
}

.sheet{
  background:var(--bg);
  border-radius:34px;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  width:calc(100% - 16px);
  margin:8px;
  max-height:90%;
  overflow-y:auto;
}

.sheet h3{
  text-align:center;
  font-size:17px;
  margin-bottom:20px;
}

.field{
  display:flex;
  align-items:center;
  min-height:52px;
  padding:0 12px;
  background:#fff;
}

.field:first-of-type{
  border-radius:16px 16px 0 0;
}

.field label{
  width:95px;
  flex-shrink:0;
}

.field input{
  min-width:0;
  flex:1;
  text-align:right;
  border:0;
  outline:0;
  background:transparent;
  user-select:text;
  -webkit-user-select:text;
}

.sheet-buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.sheet-buttons button{
  flex:1;
  height:50px;
  border:0;
  border-radius:25px;
  font-weight:600;
}

.primary{
  background:var(--blue);
  color:#fff;
}

.secondary{
  background:#e3e3e8;
}

.detail-title{
  font-size:24px;
  font-weight:700;
  margin:25px 0;
}

.detail-description{
  color:var(--sub);
  font-size:14px;
  padding:12px 16px;
  line-height:1.5;
}

.number-band{
  margin-top:30vh;
  padding:18px;
  background:#fff;
  text-align:center;
  user-select:text;
  -webkit-user-select:text;
}

.toast{
  position:absolute;
  z-index:60;
  bottom:110px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.8);
  color:white;
  border-radius:20px;
  padding:10px 18px;
  font-size:14px;
  display:none;
  white-space:nowrap;
}

.toast.show{
  display:block;
}
</style>
</head>

<body>

<div id="app">

<!-- 메인 설정 화면 -->
<section class="page" id="mainPage">

  <div class="nav">
    <div class="nav-title">설정</div>
  </div>

  <h1 class="large">설정</h1>

  <div class="group">
    <div class="profile" id="profileCard">
      <div class="avatar" id="avatar">●</div>

      <div style="flex:1">
        <div class="profile-name" id="profileName">
          김이름
        </div>
        <div class="profile-sub">
          Apple 계정, iCloud 등
        </div>
      </div>

      <span class="chevron">›</span>
    </div>

    <div class="row" data-page="Apple 계정 제안">
      <div class="label">Apple 계정 제안</div>
      <span class="badge">2</span>
      <span class="chevron">›</span>
    </div>
  </div>

  <div class="group">
    <div class="row" data-page="구입에 포함된 서비스">
      <div class="label">구입에 포함된 서비스</div>
      <span class="badge">2</span>
      <span class="chevron">›</span>
    </div>
  </div>

  <div class="group">
    <div class="row" data-page="소프트웨어 업데이트">
      <div class="label">소프트웨어 업데이트 사용 가능</div>
      <span class="chevron">›</span>
    </div>
  </div>

  <div class="group" id="networkGroup"></div>
  <div class="group" id="generalGroup"></div>
  <div class="group" id="notificationGroup"></div>
  <div class="group" id="privacyGroup"></div>
  <div class="group" id="servicesGroup"></div>
  <div class="group" id="appsGroup"></div>

</section>

<!-- 세부 설정 페이지 -->
<section class="page hidden" id="detailPage">

  <div class="nav">
    <button class="back" id="backButton">‹</button>
    <div class="nav-title" id="detailNavTitle"></div>
  </div>

  <div id="detailContent"></div>

</section>

<!-- 하단 검색 -->
<div class="dock" id="dock">
  <button class="search-button" id="openSearch">
    <span>⌕</span>
    <span>검색</span>
  </button>
</div>

<!-- 검색 화면 -->
<div class="search-page" id="searchPage">
  <div class="search-results" id="searchResults"></div>

  <div class="search-bottom">
    <input
      class="search-input"
      id="searchInput"
      placeholder="검색"
      autocomplete="off"
    >
    <button class="cancel" id="closeSearch">✕</button>
  </div>
</div>

<!-- 프로필 수정 -->
<div class="sheet-bg" id="sheetBg">
  <div class="sheet">
    <h3>Apple 계정 정보 편집</h3>

    <div class="field">
      <label>이름</label>
      <input id="editName" placeholder="이름">
    </div>

    <div class="field">
      <label>전화번호</label>
      <input id="editPhone" placeholder="전화번호">
    </div>

    <div class="field">
      <label>이메일</label>
      <input id="editEmail" placeholder="이메일">
    </div>

    <div class="field">
      <label>사진</label>
      <input id="editPhoto" type="file" accept="image/*">
    </div>

    <div class="sheet-buttons">
      <button class="secondary" id="cancelEdit">취소</button>
      <button class="primary" id="saveEdit">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

</div>

<script>
"use strict";

// 설정 항목 데이터
const groups = {
  networkGroup: [
    ["에어플레인 모드","✈","#ff9500","switch"],
    ["Wi-Fi","◉","#007aff","연결 안 됨"],
    ["Bluetooth","ᛒ","#007aff","켬"],
    ["셀룰러","▥","#34c759"],
    ["개인용 핫스팟","⛓","#34c759"],
    ["배터리","▰","#34c759"]
  ],

  generalGroup: [
    ["일반","⚙","#8e8e93"],
    ["손쉬운 사용","◉","#007aff"],
    ["검색","⌕","#77777e"],
    ["동작 버튼","●","#55555b"],
    ["디스플레이 및 밝기","☀","#007aff"],
    ["배경화면","▧","#39a6fa"],
    ["대기 모드","▤","#333333"],
    ["제어 센터","▦","#777777"],
    ["카메라","◉","#8e8e93"],
    ["홈 화면 및 앱 보관함","▦","#007aff"],
    ["Apple Intelligence 및 Siri","✦","#a358d6"]
  ],

  notificationGroup: [
    ["알림","▣","#ff3b30"],
    ["사운드 및 햅틱","♫","#ff3b30"],
    ["집중 모드","☾","#5856d6"],
    ["스크린 타임","⌛","#5856d6"]
  ],

  privacyGroup: [
    ["Face ID 및 암호","▦","#34c759"],
    ["긴급 구조 요청","✳","#ff3b30"],
    ["개인정보 보호 및 보안","✋","#007aff"]
  ],

  servicesGroup: [
    ["지갑 및 Apple Pay","▰","#222222"],
    ["Game Center","●","#ffffff"],
    ["iCloud","☁","#007aff"]
  ],

  appsGroup: [
    ["앱","▦","#8e8e93"]
  ]
};

const $ = id => document.getElementById(id);

const mainPage = $("mainPage");
const detailPage = $("detailPage");
const dock = $("dock");

let historyStack = [];

function makeRow(item){
  const [name, symbol, color, extra] = item;

  const row = document.createElement("div");
  row.className = "row icon-row";

  const icon = document.createElement("div");
  icon.className = "row-icon";
  icon.textContent = symbol;
  icon.style.background = color;
  if(color === "#ffffff"){
    icon.style.color = "#444";
    icon.style.border = "1px solid #ddd";
  }

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = name;

  row.append(icon,label);

  if(extra === "switch"){
    const sw = document.createElement("div");
    sw.className = "switch";
    row.append(sw);

    row.addEventListener("click",()=>{
      sw.classList.toggle("on");
    });
  } else {
    if(extra){
      const value = document.createElement("span");
      value.className = "value";
      value.textContent = extra;
      row.append(value);
    }

    const arrow = document.createElement("span");
    arrow.className = "chevron";
    arrow.textContent = "›";
    row.append(arrow);

    row.addEventListener("click",()=>{
      openPage(name);
    });
  }

  return row;
}

function renderGroups(){
  Object.entries(groups).forEach(([id,items])=>{
    const container = $(id);
    container.innerHTML = "";

    items.forEach(item=>{
      container.append(makeRow(item));
    });
  });
}

function makeSimpleRow(label,value){
  const row = document.createElement("div");
  row.className = "row";

  const name = document.createElement("div");
  name.className = "label";
  name.textContent = label;
  row.append(name);

  if(value !== undefined){
    const val = document.createElement("span");
    val.className = "value";
    val.textContent = value;
    row.append(val);
  }

  return row;
}

function makeGroup(items){
  const group = document.createElement("div");
  group.className = "group";

  items.forEach(([label,value])=>{
    group.append(makeSimpleRow(label,value));
  });

  return group;
}

function openPage(name){
  historyStack.push(name);

  mainPage.classList.add("hidden");
  detailPage.classList.remove("hidden");
  dock.style.display = "none";

  $("detailNavTitle").textContent = name;

  const content = $("detailContent");
  content.innerHTML = "";

  const title = document.createElement("h1");
  title.className = "detail-title";
  title.textContent = name;

  content.append(title);

  if(name === "셀룰러"){
    renderCellular(content);
  }
  else if(name === "전화"){
    renderPhone(content);
  }
  else if(name === "나의 전화번호"){
    renderMyNumber(content);
  }
  else if(name === "Apple 계정"){
    renderAppleAccount(content);
  }
  else {
    renderGeneric(content,name);
  }

  detailPage.scrollTop = 0;
  closeSearch();
}

function renderCellular(parent){
  parent.append(
    makeGroup([
      ["셀룰러 데이터","켬"],
      ["셀룰러 데이터 옵션",""],
      ["개인용 핫스팟","끔"]
    ])
  );

  parent.append(
    makeGroup([
      ["SIM",""],
      ["메인","켬"],
      ["보조","켬"],
      ["기본 음성 회선","메인"],
      ["셀룰러 데이터","메인"]
    ])
  );

  parent.append(
    makeGroup([
      ["네트워크 선택","자동"],
      ["통신사 서비스",""]
    ])
  );
}

function renderPhone(parent){
  parent.append(
    makeGroup([
      ["나의 전화번호",
       localStorage.getItem("phone") || "설정 안 됨"],
      ["수신 전화","전체 화면"],
      ["알 수 없는 발신자 음소거","끔"],
      ["차단된 연락처",""]
    ])
  );

  const rows = parent.querySelectorAll(".row");
  rows[0].addEventListener("click",()=>{
    openPage("나의 전화번호");
  });
}

function renderMyNumber(parent){
  const number = document.createElement("div");
  number.className = "number-band";
  number.textContent =
    localStorage.getItem("phone") || "전화번호 없음";

  parent.append(number);
}

function renderAppleAccount(parent){
  parent.append(
    makeGroup([
      ["이름",localStorage.getItem("name") || "김이름"],
      ["전화번호",localStorage.getItem("phone") || ""],
      ["이메일",localStorage.getItem("email") || ""],
      ["iCloud",""],
      ["미디어 및 구입 항목",""]
    ])
  );
}

function renderGeneric(parent,name){
  if(name === "앱"){
    const items = [
      "App Store","FaceTime","Safari","메시지",
      "전화","사진","카메라","Mail","음악","지도"
    ];

    const group = document.createElement("div");
    group.className = "group";

    items.forEach(item=>{
      const row = makeSimpleRow(item,"›");
      row.addEventListener("click",()=>openPage(item));
      group.append(row);
    });

    parent.append(group);
    return;
  }

  if(name === "일반"){
    const labels = [
      "정보","소프트웨어 업데이트",
      "iPhone 저장 공간","AirDrop",
      "AirPlay 및 연속성","화면 속 화면",
      "CarPlay","백그라운드 앱 새로 고침",
      "날짜 및 시간","키보드",
      "언어 및 지역","VPN 및 기기 관리",
      "전송 또는 iPhone 재설정"
    ];

    const group = document.createElement("div");
    group.className = "group";

    labels.forEach(label=>{
      const row = makeSimpleRow(label,"›");
      row.addEventListener("click",()=>openPage(label));
      group.append(row);
    });

    parent.append(group);
    return;
  }

  parent.append(
    makeGroup([[name,""]])
  );
}

function goBack(){
  historyStack.pop();

  if(historyStack.length){
    const previous = historyStack.pop();
    openPage(previous);
  }else{
    detailPage.classList.add("hidden");
    mainPage.classList.remove("hidden");
    dock.style.display = "block";
  }
}

$("backButton").addEventListener("click",goBack);

// 검색
const searchPage = $("searchPage");
const searchInput = $("searchInput");

function openSearch(){
  searchPage.classList.add("open");
  searchInput.value = "";
  $("searchResults").innerHTML =
    '<div style="text-align:center;color:#8e8e93;margin-top:30vh">설정 검색</div>';
  searchInput.focus();
}

function closeSearch(){
  searchPage.classList.remove("open");
  searchInput.blur();
}

$("openSearch").addEventListener("click",openSearch);
$("closeSearch").addEventListener("click",closeSearch);

searchInput.addEventListener("input",()=>{
  const query = searchInput.value.trim().toLowerCase();
  const results = $("searchResults");

  results.innerHTML = "";

  if(!query){
    return;
  }

  const names = [
    "Apple 계정","일반","소프트웨어 업데이트",
    "전화","나의 전화번호",
    ...Object.values(groups)
      .flat()
      .map(item=>item[0])
  ];

  const matches = [...new Set(names)]
    .filter(name=>name.toLowerCase().includes(query));

  if(!matches.length){
    results.innerHTML =
      '<div style="text-align:center;color:#8e8e93;margin-top:30px">검색 결과 없음</div>';
    return;
  }

  const group = document.createElement("div");
  group.className = "group";

  matches.forEach(name=>{
    const row = makeSimpleRow(name,"›");
    row.addEventListener("click",()=>{
      openPage(name);
    });
    group.append(row);
  });

  results.append(group);
});

// 프로필 편집
const sheetBg = $("sheetBg");

function openEdit(){
  $("editName").value =
    localStorage.getItem("name") || "김이름";

  $("editPhone").value =
    localStorage.getItem("phone") || "";

  $("editEmail").value =
    localStorage.getItem("email") || "";

  sheetBg.classList.add("open");
}

function closeEdit(){
  sheetBg.classList.remove("open");
}

$("profileCard").addEventListener("click",openEdit);
$("cancelEdit").addEventListener("click",closeEdit);

sheetBg.addEventListener("click",event=>{
  if(event.target === sheetBg){
    closeEdit();
  }
});

function showToast(message){
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },1800);
}

function loadProfile(){
  $("profileName").textContent =
    localStorage.getItem("name") || "김이름";

  const savedPhoto = localStorage.getItem("photo");

  if(savedPhoto){
    $("avatar").innerHTML = "";
    const img = document.createElement("img");
    img.src = savedPhoto;
    $("avatar").append(img);
  }
}

$("saveEdit").addEventListener("click",()=>{
  localStorage.setItem("name",$("editName").value);
  localStorage.setItem("phone",$("editPhone").value);
  localStorage.setItem("email",$("editEmail").value);

  const file = $("editPhoto").files[0];

  if(file){
    const reader = new FileReader();

    reader.onload = ()=>{
      try{
        localStorage.setItem("photo",reader.result);
      }catch(error){
        showToast("사진 용량이 너무 큽니다");
      }
      loadProfile();
    };

    reader.readAsDataURL(file);
  }

  loadProfile();
  closeEdit();
  showToast("저장되었습니다");
});

// 뒤로 가기 키 지원
document.addEventListener("keydown",event=>{
  if(event.key === "Escape"){
    if(sheetBg.classList.contains("open")){
      closeEdit();
    }
    else if(searchPage.classList.contains("open")){
      closeSearch();
    }
    else if(!detailPage.classList.contains("hidden")){
      goBack();
    }
  }
});

// 시작
renderGroups();
loadProfile();

</script>
